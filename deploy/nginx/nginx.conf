user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$real_client_ip - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;  # upload de currículos (PDF até 10MB)

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # IP real do visitante: atras do Cloudflare Tunnel o $remote_addr e
    # sempre o IP do container cloudflared, entao o rate limit precisa usar
    # o CF-Connecting-IP. Fallback para $remote_addr quando o header falta.
    map $http_cf_connecting_ip $real_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # Rate limit (protecao basica) - por IP real do visitante
    # ATENCAO: o nginx so aceita r/s e r/m em limit_req_zone. "10r/h" e
    # sintaxe invalida e derruba o processo no boot com
    # [emerg] invalid rate. A intencao original era ~10 candidaturas/hora;
    # o mais proximo valido e 1r/m com burst, configurado na location.
    limit_req_zone $real_client_ip zone=login:10m rate=5r/m;
    limit_req_zone $real_client_ip zone=apply:10m rate=1r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
