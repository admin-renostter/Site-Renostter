# ============================================================
# Renostter - Django (carreiras.renostter.com)
# ============================================================
# Recebe o trafego do Cloudflare Tunnel (HTTP puro na porta 80).
# O TLS termina no Cloudflare.
# ============================================================

server {
    listen 80;
    server_name carreiras.renostter.com _;

    # DNS interno do Docker. Sem isso o proxy_pass com variavel nao resolve.
    # valid=10s: se o container web trocar de IP, o nginx acompanha em 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Seguranca basica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/renostter.access.log;
    error_log  /var/log/nginx/renostter.error.log;

    # Health check (Uptime Kuma / Cloudflare)
    location = /healthz/ {
        access_log off;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /admin/\nAllow: /\n";
    }

    # Estaticos servidos direto pelo Nginx (volume django_static)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Bloqueia arquivos sensiveis
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    # Rate limit em rotas sensiveis.
    # ATENCAO: limit_req NAO pode ficar dentro de um bloco `if` - o nginx
    # recusa a config e nem sobe. Por isso cada rota tem sua propria
    # location com prefixo `^~` (tem precedencia sobre `location /`).
    # ------------------------------------------------------------------
    location ^~ /admin/login {
        limit_req zone=login burst=3 nodelay;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    location ^~ /candidatar {
        limit_req zone=apply burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy_backend.inc;
    }
}
