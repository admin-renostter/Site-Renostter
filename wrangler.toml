name = "renostter-gemini-proxy"
main = "proxy/worker.js"
compatibility_date = "2026-06-05"

[observability]
enabled = true

[vars]
RATE_LIMIT_RPM = "20"

# Fila de reenvio ao CRM: pedidos do site e do e-mail esperam aqui se o CRM estiver fora (atualizacao).
[[queues.producers]]
queue = "renostter-fila-crm"
binding = "FILA_CRM"

[[queues.consumers]]
queue = "renostter-fila-crm"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 50
